<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="E">
  <!--
    Eirik Myrvoll-Nilsen — site mark.

    An E whose three arms are the bars of a bar plot: a thin
    blue axis (#4da3ff, the same accent as the vertical rules
    beside the CV entries) with thicker white bars of unequal
    length coming off it. The square bar ends and the shorter
    middle bar are what keep both readings alive.

    Set on a 64-unit grid, ink bounding box centred on
    (32, 32): x 13-51, y 8-56. Gaps between bars equal the
    axis width, so the spacing is self-consistent.
  -->

  <rect width="64" height="64" fill="#000000"/>

  <!-- axis -->
  <rect x="13" y="8" width="6" height="48" fill="#4da3ff"/>

  <!-- bars: 100% / 60% / 92% of a 32-unit reach -->
  <rect x="19" y="8"  width="32" height="12" fill="#ffffff"/>
  <rect x="19" y="26" width="19" height="12" fill="#ffffff"/>
  <rect x="19" y="44" width="29" height="12" fill="#ffffff"/>
</svg>
